name: ci

# Windows and Linux on every push; macOS on main and tags. Video features need ffmpeg, which is never bundled, so each job installs it.
on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (video tests need it; Nordle never bundles it)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
          ffmpeg -version | head -1
      - run: npm ci
      - name: Install the rendering browser (Linux also needs its system libraries)
        run: npx playwright-core install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: node tools/doctor.mjs --ci
      - run: npm run validate
      - name: Tests (a file that fails is run once more on its own: the browser tests are timing-sensitive on slow runners)
        run: node tools/run-tests.mjs
      - name: Render the sample project and keep the contact sheets
        run: node nordle.mjs verify samples/little-gannet
      - run: node nordle.mjs render samples/little-gannet --sheet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheets-${{ matrix.os }}
          path: samples/little-gannet/out/**/sheet.png
          if-no-files-found: ignore

  verify-macos:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (video tests need it; Nordle never bundles it)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
          ffmpeg -version | head -1
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: node tools/doctor.mjs --ci
      - run: npm run validate
      - name: Tests (a file that fails is run once more on its own: the browser tests are timing-sensitive on slow runners)
        run: node tools/run-tests.mjs
      - run: node nordle.mjs verify samples/little-gannet
